$kind: http-request
description: "Planned; returns 404 until implemented. Get rating. See backend/docs/api-request-list.md for the contract."
url: "{{base_url}}/api/tasks/{{task_id}}/rating"
method: GET
headers:
  "Accept": "application/json"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      if (pm.response.code === 200) {
      function checkRating(r) {
        pm.expect(r.score).to.be.within(0, 100);
        const weights = { context_need:20, data:20, expected_result:15, success_criteria:15, constraints:10, users:10, business_connection:10 };
        pm.expect(r.breakdown.map(b => b.key).sort()).to.eql(Object.keys(weights).sort());
        r.breakdown.forEach(b => { pm.expect(b.max).to.eql(weights[b.key]); pm.expect(b.earned).to.be.within(0, b.max); });
        pm.expect(r.breakdown.reduce((n,b) => n+b.earned,0)).to.eql(r.score);
        pm.expect(r.level).to.eql(r.score < 40 ? 'draft' : r.score < 70 ? 'workable' : r.score < 90 ? 'ready' : 'priority');
        pm.expect(r.missing_fields).to.be.an('array');
      }
      pm.test('Official and preview scoring are consistent', () => { const b = pm.response.json(); checkRating(b.rating); checkRating(b.rating_preview); pm.expect(b.rating.score).to.eql(0); pm.expect(b.rating_preview.score).to.eql(100); });
      }
order: 7000
