$kind: http-request
description: "Planned; returns 404 until implemented. Publish task. See backend/docs/api-request-list.md for the contract."
url: "{{base_url}}/api/tasks/{{task_id}}/publish"
method: POST
headers:
  "Accept": "application/json"
  "Content-Type": "application/json"
body:
  type: json
  content: |-
    {
      "revision": {{revision}}
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      if (pm.response.code === 200) {
      const task = pm.response.json().task;
      pm.test('Task has an ID and revision', () => { pm.expect(task.id).to.be.a('string').and.not.empty; pm.expect(task.revision).to.be.a('number'); });
      if (task && task.id && Number.isInteger(task.revision)) { pm.collectionVariables.set('task_id', task.id); pm.collectionVariables.set('revision', task.revision); }
      pm.test('Published', () => pm.expect(task.status).to.eql('published'));
      }
order: 9000
