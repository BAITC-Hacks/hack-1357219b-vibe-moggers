$kind: http-request
description: "Implemented. See backend/docs/api-request-list.md."
url: "{{base_url}}/api/tasks"
method: POST
headers:
  Accept: "application/json"
  Content-Type: "application/json"
  X-Demo-Actor: "business:{{business_id}}"
body:
  type: json
  content: |-
    {
      "draft": "Our shop needs better stock planning. We plan purchases manually and have synthetic sales data.",
      "title": "Stock planning prototype",
      "industry": "retail"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 201',()=>pm.response.to.have.status(201));
      pm.test('JSON response',()=>pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      if (pm.response.code === 201) {
        const d = pm.response.json().data;
        pm.test('Data envelope',()=>pm.expect(d).not.to.eql(undefined));
        if (d.id && Number.isInteger(d.revision)) { pm.collectionVariables.set('task_id',d.id); pm.collectionVariables.set('revision',d.revision); }
      }
order: 4000
