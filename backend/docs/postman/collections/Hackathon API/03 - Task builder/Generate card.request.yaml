$kind: http-request
description: "Implemented. See backend/docs/api-request-list.md."
url: "{{base_url}}/api/ai/analyze"
method: POST
headers:
  Accept: "application/json"
  Content-Type: "application/json"
  X-Demo-Actor: "business:{{business_id}}"
body:
  type: json
  content: |-
    {
      "stage": "assemble",
      "sources": [
        {
          "id": "draft",
          "text": "Our shop needs better stock planning. We plan purchases manually and have synthetic sales data."
        },
        {
          "id": "answer-1",
          "text": "Sales data is available as CSV."
        }
      ],
      "currentFields": {}
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 200',()=>pm.response.to.have.status(200));
      pm.test('JSON response',()=>pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      if (pm.response.code === 200) {
        const d = pm.response.json().data;
        pm.test('Data envelope',()=>pm.expect(d).not.to.eql(undefined));
        pm.test('Suggestions returned as array',()=>pm.expect(d.fieldSuggestions).to.be.an('array'));
      }
order: 8000
