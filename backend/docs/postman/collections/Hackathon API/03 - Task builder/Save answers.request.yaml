$kind: http-request
description: "Planned; returns 404 until implemented. Save answers. See backend/docs/api-request-list.md for the contract."
url: "{{base_url}}/api/tasks/{{task_id}}/answers"
method: PUT
headers:
  "Accept": "application/json"
  "Content-Type": "application/json"
body:
  type: json
  content: |-
    {
      "revision": {{revision}},
      "answers": [
        {
          "question_id": "{{question_1_id}}",
          "answer": "Retail customers need to compare our service catalog before calling staff."
        },
        {
          "question_id": "{{question_2_id}}",
          "answer": "We can provide anonymized service names, descriptions and prices."
        },
        {
          "question_id": "{{question_3_id}}",
          "answer": "Build a web prototype in one week; five users should compare three services without help."
        }
      ]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      if (pm.response.code === 200) {
      const task = pm.response.json().task;
      pm.test('Task has an ID and revision', () => { pm.expect(task.id).to.be.a('string').and.not.empty; pm.expect(task.revision).to.be.a('number'); });
      if (task && task.id && Number.isInteger(task.revision)) { pm.collectionVariables.set('task_id', task.id); pm.collectionVariables.set('revision', task.revision); }
      }
order: 4000
