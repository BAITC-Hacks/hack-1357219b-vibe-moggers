$kind: http-request
description: "Planned; returns 404 until implemented. Generate questions. See backend/docs/api-request-list.md for the contract."
url: "{{base_url}}/api/tasks/{{task_id}}/questions"
method: POST
headers:
  "Accept": "application/json"
  "Content-Type": "application/json"
body:
  type: json
  content: |-
    {
      "revision": {{revision}}
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      if (pm.response.code === 200) {
      const task = pm.response.json().task;
      pm.test('Task has an ID and revision', () => { pm.expect(task.id).to.be.a('string').and.not.empty; pm.expect(task.revision).to.be.a('number'); });
      if (task && task.id && Number.isInteger(task.revision)) { pm.collectionVariables.set('task_id', task.id); pm.collectionVariables.set('revision', task.revision); }
      const questions = task.questions;
      pm.test('At least three persistent questions', () => { pm.expect(questions.length).to.be.at.least(3); questions.forEach(q => { pm.expect(q.id).to.be.a('string').and.not.empty; pm.expect(q.question).to.be.a('string').and.not.empty; }); });
      questions.slice(0,3).forEach((q,i) => pm.collectionVariables.set('question_'+(i+1)+'_id', q.id));
      pm.test('AI source is disclosed', () => pm.expect(pm.response.json().ai.provider).to.be.oneOf(['openai','stub']));
      }
order: 3000
