$kind: http-request
description: "Planned; returns 404 until implemented. Edit card. See backend/docs/api-request-list.md for the contract."
url: "{{base_url}}/api/tasks/{{task_id}}"
method: PUT
headers:
  "Accept": "application/json"
  "Content-Type": "application/json"
body:
  type: json
  content: |-
    {
      "revision": {{revision}},
      "topic": "retail",
      "card": {
        "title": "Service comparison tool",
        "context": "Customers ask staff to explain service differences.",
        "need": "Let customers compare services before contacting staff.",
        "users": "Retail customers",
        "data": "An anonymized service catalog with names and prices",
        "constraints": "Web prototype in one week; no customer personal data",
        "expected_result": "A working comparison prototype",
        "success_criteria": "Five test users can compare three services without help",
        "contact": "demo-business@example.com",
        "interaction_format": "Weekly video review and written feedback within two days"
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      if (pm.response.code === 200) {
      const task = pm.response.json().task;
      pm.test('Task has an ID and revision', () => { pm.expect(task.id).to.be.a('string').and.not.empty; pm.expect(task.revision).to.be.a('number'); });
      if (task && task.id && Number.isInteger(task.revision)) { pm.collectionVariables.set('task_id', task.id); pm.collectionVariables.set('revision', task.revision); }
      pm.test('Completed preview scores 100 before confirmation', () => { pm.expect(task.rating_preview.score).to.eql(100); pm.expect(task.rating.score).to.eql(0); });
      }
order: 6000
