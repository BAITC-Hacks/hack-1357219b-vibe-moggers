$kind: http-request
description: "Implemented. See backend/docs/api-request-list.md."
url: "{{base_url}}/api/proposals/{{proposal_id}}/milestone"
method: POST
headers:
  Accept: "application/json"
  Content-Type: "application/json"
  X-Demo-Actor: "team:{{team_id}}"
body:
  type: json
  content: |-
    {
      "resultText": "The prototype passes the agreed purchasing scenarios.",
      "evidenceUrl": "https://example.org/results/stock-planner"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 200',()=>pm.response.to.have.status(200));
      pm.test('JSON response',()=>pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      if (pm.response.code === 200) {
        const d = pm.response.json().data;
        pm.test('Data envelope',()=>pm.expect(d).not.to.eql(undefined));
        pm.collectionVariables.set('milestone_id',d.id);
        pm.test('No award before review',()=>pm.expect(d.points).to.eql(0));
      }
order: 19000
