$kind: http-request
description: "List offers as the task owner. Set business_id to tasks.owner_id. Implemented."
url: "{{base_url}}/api/tasks/{{task_id}}/proposals?limit=20&offset=0"
method: GET
headers:
  "Accept": "application/json"
  "X-Demo-Actor": "business:{{business_id}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      if (pm.response.code === 200) {
      const body = pm.response.json();
      pm.test('Paginated list', () => { pm.expect(body.items).to.be.an('array'); pm.expect(body.total).to.be.a('number'); pm.expect(body.limit).to.be.a('number'); pm.expect(body.offset).to.be.a('number'); });
      }
order: 1000
