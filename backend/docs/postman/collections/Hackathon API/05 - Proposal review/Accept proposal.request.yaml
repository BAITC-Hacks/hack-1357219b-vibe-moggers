$kind: http-request
description: "Accept as the task owner and award 10 points once. Repeated acceptance is safe. Implemented."
url: "{{base_url}}/api/proposals/{{proposal_id}}/accept"
method: POST
headers:
  "Accept": "application/json"
  "X-Demo-Actor": "business:{{business_id}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      if (pm.response.code === 200) {
      pm.test('Accepted manually', () => pm.expect(pm.response.json().proposal.status).to.eql('accepted'));
      }
order: 2000
