$kind: http-request
description: "Reject as the task owner without changing other offers. Existing acceptance points are retained. Implemented."
url: "{{base_url}}/api/proposals/{{proposal_id}}/reject"
method: POST
headers:
  "Accept": "application/json"
  "X-Demo-Actor": "business:{{business_id}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      if (pm.response.code === 200) {
      pm.test('Rejected manually', () => pm.expect(pm.response.json().proposal.status).to.eql('rejected'));
      }
order: 3000
