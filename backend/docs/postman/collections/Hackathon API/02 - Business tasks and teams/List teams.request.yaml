$kind: http-request
description: "Implemented. See backend/docs/api-request-list.md."
url: "{{base_url}}/api/teams"
method: GET
headers:
  Accept: "application/json"
  Content-Type: "application/json"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 200',()=>pm.response.to.have.status(200));
      pm.test('JSON response',()=>pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      if (pm.response.code === 200) {
        const d = pm.response.json().data;
        pm.test('Data envelope',()=>pm.expect(d).not.to.eql(undefined));
        pm.test('Five demo teams',()=>pm.expect(d.items.length).to.be.at.least(5)); pm.collectionVariables.set('team_id',d.items[0].id); pm.collectionVariables.set('second_team_id',d.items[1].id);
      }
order: 2000
