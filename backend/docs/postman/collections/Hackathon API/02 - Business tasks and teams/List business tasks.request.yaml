$kind: http-request
description: "Planned; returns 404 until implemented. List business tasks. See backend/docs/api-request-list.md for the contract."
url: "{{base_url}}/api/tasks?limit=20&offset=0"
method: GET
headers:
  "Accept": "application/json"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      if (pm.response.code === 200) {
      const body = pm.response.json();
      pm.test('Paginated list', () => { pm.expect(body.items).to.be.an('array'); pm.expect(body.total).to.be.a('number'); pm.expect(body.limit).to.be.a('number'); pm.expect(body.offset).to.be.a('number'); });
      }
order: 1000
