scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 200',()=>pm.response.to.have.status(200));
      pm.test('JSON response',()=>pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      if (pm.response.code === 200) {
        const d = pm.response.json().data;
        pm.test('Data envelope',()=>pm.expect(d).not.to.eql(undefined));
        if (d.id && Number.isInteger(d.revision)) { pm.collectionVariables.set('task_id',d.id); pm.collectionVariables.set('revision',d.revision); }
        pm.test('Preview 95, public still 40',()=>{pm.expect(d.preview.total).to.eql(95);pm.expect(d.confirmedSnapshot.total).to.eql(40);});
      }
order: 22000
