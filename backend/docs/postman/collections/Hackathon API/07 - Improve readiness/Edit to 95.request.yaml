          "source": null
        },
        "dataSource": {
          "value": "We have synthetic sales and stock data.",
          "confirmed": false,
          "source": null
        },
        "deliverable": {
          "value": "A working stock-planning prototype.",
          "confirmed": false,
          "source": null
        },
        "dataFormat": {
          "value": "CSV: date, sku, sales, stock.",
          "confirmed": false,
          "source": null
        },
        "dataAccess": {
          "value": "A sample CSV will be shared with the accepted team.",
          "confirmed": false,
          "source": null
        },
        "deliveryFormat": {
          "value": "A web page with CSV import.",
          "confirmed": false,
          "source": null
        },
        "successMetric": {
