$kind: http-request
description: "Implemented. See backend/docs/api-request-list.md."
url: "{{base_url}}/api/tasks/{{task_id}}/confirm"
method: POST
headers:
  Accept: "application/json"
  Content-Type: "application/json"
  X-Demo-Actor: "business:{{business_id}}"
body:
  type: json
  content: |-
    {
      "revision": {{revision}},
      "fieldKeys": [
        "context",
        "need",
        "dataSource",
        "deliverable",
        "dataFormat",
        "dataAccess",
        "deliveryFormat",
        "successMetric",
        "successTarget",
        "acceptanceMethod",
        "deadline",
        "constraints",
        "users",
        "usageScenario",
        "contact"
      ],
      "reviewed": true
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 200',()=>pm.response.to.have.status(200));
      pm.test('JSON response',()=>pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      if (pm.response.code === 200) {
        const d = pm.response.json().data;
        pm.test('Data envelope',()=>pm.expect(d).not.to.eql(undefined));
        if (d.id && Number.isInteger(d.revision)) { pm.collectionVariables.set('task_id',d.id); pm.collectionVariables.set('revision',d.revision); }
        pm.test('Confirmed 95',()=>pm.expect(d.confirmedSnapshot.total).to.eql(95));
      }
order: 23000
