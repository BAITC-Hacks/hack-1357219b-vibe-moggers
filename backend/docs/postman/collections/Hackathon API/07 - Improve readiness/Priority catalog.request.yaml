$kind: http-request
description: "Implemented. See backend/docs/api-request-list.md."
url: "{{base_url}}/api/tasks?readiness=priority"
method: GET
headers:
  Accept: "application/json"
  Content-Type: "application/json"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 200',()=>pm.response.to.have.status(200));
      pm.test('JSON response',()=>pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      if (pm.response.code === 200) {
        const d = pm.response.json().data;
        pm.test('Data envelope',()=>pm.expect(d).not.to.eql(undefined));
        pm.test('Updated task is priority',()=>pm.expect(d.items.some(t=>t.id===pm.collectionVariables.get('task_id')&&t.total===95)).to.eql(true));
      }
order: 24000
